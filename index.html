<!doctype html>
<html lang="en">

<script>
window.addEventListener('error', function (event) {
  document.body.innerHTML =
    '<pre style="white-space:pre-wrap;padding:20px;color:#ff7777;background:#0b1020;font-size:14px;">' +
    'MEC RUNTIME ERROR:\n\n' +
    (event.error?.stack || event.message || 'Unknown browser error') +
    '</pre>'
})
window.addEventListener('unhandledrejection', function (event) {
  document.body.innerHTML =
    '<pre style="white-space:pre-wrap;padding:20px;color:#ff7777;background:#0b1020;font-size:14px;">' +
    'MEC PROMISE ERROR:\n\n' +
    (event.reason?.stack || event.reason || 'Unknown promise error') +
    '</pre>'
})
</script>
